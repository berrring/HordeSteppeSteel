<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0B83E"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </radialGradient>
  </defs>
  <!-- Golden circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#5C4410" stroke-width="4"/>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#5C4410" stroke-width="1.5" opacity="0.5"/>
  <!-- Horseman silhouette -->
  <g transform="translate(64, 68)" fill="#3D2800">
    <!-- Horse body -->
    <ellipse cx="0" cy="6" rx="22" ry="10"/>
    <!-- Horse head/neck -->
    <path d="M 18,0 Q 28,-12 30,-18 Q 32,-20 28,-20 Q 24,-16 20,-8 Q 18,-4 16,2 Z"/>
    <!-- Horse legs -->
    <line x1="-12" y1="14" x2="-16" y2="28" stroke="#3D2800" stroke-width="3" stroke-linecap="round"/>
    <line x1="-4" y1="14" x2="-2" y2="28" stroke="#3D2800" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="14" x2="6" y2="28" stroke="#3D2800" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="12" x2="20" y2="26" stroke="#3D2800" stroke-width="3" stroke-linecap="round"/>
    <!-- Horse tail -->
    <path d="M -20,4 Q -30,0 -28,10" stroke="#3D2800" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Rider torso -->
    <ellipse cx="2" cy="-6" rx="6" ry="10"/>
    <!-- Rider head -->
    <circle cx="4" cy="-18" r="6"/>
    <!-- Bow -->
    <path d="M -6,-16 Q -18,-10 -6,-2" stroke="#3D2800" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arrow -->
    <line x1="-6" y1="-10" x2="10" y2="-14" stroke="#3D2800" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Title letter -->
  <text x="64" y="112" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#3D2800" opacity="0.6">HORDE</text>
</svg>
